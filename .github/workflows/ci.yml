name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run sdk:check
      - run: npm run build
      - run: npm pack --dry-run

  variaq-integration:
    name: VariaQ 0.3.0 integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aaronphifer/variaq
          # Immutable release tag for the verified VariaQ 0.3.x integration.
          ref: v0.3.0
          path: .variaq-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .variaq-source/pyproject.toml
      - name: Install VariaQ quantum environment
        run: |
          python -m venv "$RUNNER_TEMP/variaq-venv"
          "$RUNNER_TEMP/variaq-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/variaq-venv/bin/python" -m pip install -e './.variaq-source[quantum]'
      - run: npm ci
      - name: Run real local integration suite
        env:
          VARIAQ_TEST_PROJECT: ${{ github.workspace }}/.variaq-source
          VARIAQ_TEST_PYTHON: ${{ runner.temp }}/variaq-venv/bin/python
        run: npm run test:integration
